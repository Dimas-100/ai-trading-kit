name: release
# Builds the one-file kit for Windows, macOS and Linux and attaches it to a GitHub release.
# Trigger: push a tag like v0.1.0, or run it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: aitk-windows.exe
            built: dist/aitk.exe
          - os: macos-latest
            artifact: aitk-macos
            built: dist/aitk
          - os: ubuntu-latest
            artifact: aitk-linux
            built: dist/aitk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller packaging/aitk.spec
      - name: Smoke test the build
        run: |
          ${{ matrix.built }} --version
          ${{ matrix.built }} brokers
          ${{ matrix.built }} backtest sma_cross SPY --years 2
        env:
          AITK_HOME: ${{ runner.temp }}/aitk-home
          AITK_SECRETS: file
      - run: mv ${{ matrix.built }} ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
