[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-kit"
version = "0.1.0"
description = "Connect your brokerage to your AI assistant, then learn to test and practice trading ideas safely. Read-only and practice money only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aitk = "aitk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitk = ["connect/recipes/*.toml", "guide/prompts/*.md", "guide/lessons/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
